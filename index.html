<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .home-minimal {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 140px 24px 96px;
            background:
                linear-gradient(180deg, rgba(99, 102, 241, 0.06), transparent 42%),
                var(--bg-primary);
        }

        .home-panel {
            width: min(760px, 100%);
            text-align: center;
        }

        .home-name {
            margin: 0 0 36px;
            color: var(--text-primary);
            font-size: clamp(64px, 14vw, 156px);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: 0;
        }

        .home-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 132px;
            min-height: 52px;
            padding: 14px 26px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .home-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: var(--card-shadow-hover);
        }

        .home-link.primary {
            color: #fff;
            border-color: transparent;
            background: var(--accent-gradient);
        }

        @media (max-width: 640px) {
            .home-minimal {
                padding-top: 120px;
            }

            .home-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .home-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </div>

    <div id="navbar-placeholder"></div>

    <main class="home-minimal">
        <section class="home-panel" aria-label="PGH">
            <h1 class="home-name">PGH</h1>
            <div class="home-actions">
                <a class="home-link primary" href="projects.html">项目</a>
                <a class="home-link" href="blog.html">博客</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="components/load-components.js"></script>
    <script src="script.js"></script>
</body>
</html>
