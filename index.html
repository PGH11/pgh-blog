<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .home-minimal {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 132px 24px 88px;
            background:
                linear-gradient(180deg, rgba(99, 102, 241, 0.06), transparent 42%),
                var(--bg-primary);
        }

        .home-panel {
            width: min(960px, 100%);
            text-align: center;
        }

        .home-name {
            margin: 0 0 18px;
            color: var(--text-primary);
            font-size: clamp(64px, 13vw, 142px);
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: 0;
        }

        .home-line {
            max-width: 620px;
            margin: 0 auto 34px;
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 1.8;
        }

        .home-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 56px;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 132px;
            min-height: 52px;
            padding: 14px 26px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .home-link:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: var(--card-shadow-hover);
        }

        .home-link.primary {
            color: #fff;
            border-color: transparent;
            background: var(--accent-gradient);
        }

        .home-blog-section {
            text-align: left;
        }

        .home-section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .home-section-title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
        }

        .home-section-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .home-posts {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .home-post {
            display: flex;
            min-height: 172px;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            text-decoration: none;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .home-post:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: var(--card-shadow-hover);
        }

        .home-post-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            color: var(--text-tertiary);
            font-size: 12px;
            font-weight: 600;
        }

        .home-post-title {
            margin: 0;
            color: var(--text-primary);
            font-size: 17px;
            line-height: 1.55;
            font-weight: 700;
        }

        .home-post-more {
            margin-top: 20px;
            color: var(--accent-primary);
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            .home-minimal {
                padding-top: 120px;
            }

            .home-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .home-link {
                width: 100%;
            }

            .home-section-head {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .home-posts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
